services:
  - type: web
    name: ac-library-services-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/library-management-system-1.0.0.jar
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
